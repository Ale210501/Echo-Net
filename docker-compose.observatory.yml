version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./observatory/ollama:/root/.ollama
    restart: unless-stopped

  conpot:
    image: dtagdevsec/conpot:24.04.1
    container_name: conpot_manual
    networks:
      - honeynet_net
    volumes:
      - ./observatory/ot/conpot_volume:/var/log/conpot
    restart: unless-stopped
    profiles:
      - ot

networks:
  honeynet_net:
    external: true
